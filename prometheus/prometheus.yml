# ─────────────────────────────────────────────────────────────────────────────
#  Конфиг Prometheus: что скрейпить и куда отправлять алерты.
#  После правки: make reload   (перечитает файл без перезапуска контейнера)
# ─────────────────────────────────────────────────────────────────────────────
global:
  scrape_interval: 15s      # как часто собираем метрики
  scrape_timeout: 10s       # сколько ждём ответа от экспортёра
  evaluation_interval: 15s  # как часто считаем правила (recording + alerting)

  # Эти лейблы Prometheus добавляет к КАЖДОЙ метрике и алерту.
  # Когда стендов станет больше одного — по ним удобно разделять в Grafana.
  external_labels:
    cluster: pet-lab
    env: dev
    monitor: prometheus-01

# Файлы с правилами. Маска — чтобы не перечислять каждый файл руками.
rule_files:
  - /etc/prometheus/rules/*.yml

# Куда Prometheus отправляет сработавшие алерты.
alerting:
  alertmanagers:
    - api_version: v2
      timeout: 10s
      static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # ── Сам Prometheus: его собственные метрики (скрейпы, TSDB, правила) ──────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Хост (WSL): CPU, память, диски, сеть, load average ────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: host

  # ── Наше приложение: бизнес- и HTTP-метрики ───────────────────────────────
  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          component: api
          service: order-service

  # ── Reverse-proxy ─────────────────────────────────────────────────────────
  - job_name: nginx-exporter
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          component: edge

  # ── База данных ───────────────────────────────────────────────────────────
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          component: database

  # ── Мониторим сам мониторинг: без этих таргетов алерты могут «молчать» ────
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          component: alerting

  - job_name: alertbot
    static_configs:
      - targets: ["alertbot:8080"]
        labels:
          component: alerting

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          component: visualization

  # ── Синтетические пробы через blackbox-exporter ───────────────────────────
  #    Prometheus сам НЕ ходит по адресу из targets: он просит blackbox
  #    «проверь вот этот URL». Поэтому ниже переклеиваются лейблы:
  #      __param_target — что проверять (уходит параметром ?target=)
  #      instance       — как цель будет называться на графиках
  #      __address__    — кому на самом деле стучимся (blackbox)
  - job_name: blackbox-http
    metrics_path: /probe
    scrape_interval: 30s
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://app:8000/health
          - http://nginx:80/nginx-health
          - http://prometheus:9090/-/healthy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - target_label: component
        replacement: synthetic
