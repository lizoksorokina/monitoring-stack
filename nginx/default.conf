# ─────────────────────────────────────────────────────────────────────────────
#  nginx как точка входа перед приложением.
#  /stub_status — встроенный модуль nginx, из которого nginx-exporter
#  читает метрики (активные соединения, счётчик запросов и т.д.).
# ─────────────────────────────────────────────────────────────────────────────

# Расширенный формат лога: по $request_time и $upstream_response_time потом
# можно разбирать инциденты (и это бесплатный источник данных для Loki).
# Имя НЕ "main": в образе nginx оно уже занято, иначе nginx не стартует
# с ошибкой `duplicate "log_format" name "main"`.
log_format obs_main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout obs_main;
    error_log  /dev/stderr warn;

    # Если приложение «залипло», nginx не должен висеть вместе с ним
    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    # Лёгкая ручка для blackbox/healthcheck — не задевает приложение
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Сюда ходит nginx-prometheus-exporter
    location = /stub_status {
        stub_status;
        access_log off;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
